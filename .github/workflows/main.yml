name: Ubuntu Desktop Full RDP

on:
  workflow_dispatch:

jobs:
  start-ubuntu-rdp:
    runs-on: ubuntu-latest
    steps:
      - name: Install XFCE Desktop and XRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp
          echo "xfce4-session" > ~/.xsession
          sudo service xrdp restart
          echo "runner:mypassword" | sudo chpasswd

      - name: Setup Ngrok TCP Tunnel
        run: |
          curl -sSL https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install -y ngrok
          ngrok config add-authtoken 3HiVFNJcIgGRlEgHkJk1cuyDUIz_2W2DoMNk4bC6bPZU7cXUP
          ngrok tcp 3389 --log=stdout
