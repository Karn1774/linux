name: Ubuntu Desktop Full RDP

on:
  workflow_dispatch:

jobs:
  start-ubuntu-rdp:
    runs-on: ubuntu-latest
    steps:
      - name: Install XFCE Desktop and XRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp
          echo "xfce4-session" > ~/.xsession
          sudo service xrdp restart
          echo "runner:mypassword" | sudo chpasswd

      - name: Start Ngrok TCP Tunnel via Docker
        run: |
          docker run --rm --net=host \
            -e NGROK_AUTHTOKEN=3HiVFNJcIgGRlEgHkJk1cuyDUIz_2W2DoMNk4bC6bPZU7cXUP \
            ngrok/ngrok:latest tcp 3389 --log=stdout

