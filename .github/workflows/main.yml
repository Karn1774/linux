name: Temporary Linux GUI VPS

on:
  workflow_dispatch:

jobs:
  start-gui-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Start Ubuntu Desktop and Cloudflare Tunnel
        run: |
          docker run -d --name ubuntu-gui \
            -p 6080:80 \
            -e VNC_PASSWORD=mypassword \
            --shm-size=1g \
            dorowu/ubuntu-desktop-lxde-vnc

          docker run --rm --net=host cloudflare/cloudflared:latest tunnel --url http://localhost:6080
